# TEXORA APK Build Workflow
# INSTRUCTIONS:
# 1. Create folder .github/workflows in your repo root
# 2. Move this file there as build.yml
# 3. Push to GitHub - Actions will build APK automatically
# 4. Download artifact TEXORA-release-apk

name: TEXORA Build APK
on:
  push:
    branches: [ "main", "arena/019ff223-texora-market" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true
      - name: Install deps
        run: flutter pub get
      - name: Analyze
        run: flutter analyze || true
      - name: Test
        run: flutter test || true
      - name: Build APK
        run: flutter build apk --release --verbose
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TEXORA-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
