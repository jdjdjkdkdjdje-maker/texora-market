name: texora_market
description: TEXORA - Professional tech marketplace with local database, PC builder, AI assistant. Offline-first.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.0.3
  http: ^1.2.2
  intl: ^0.19.0
  uuid: ^4.5.1
  equatable: ^2.0.5
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/images/products/
    - assets/images/categories/
    - assets/images/brands/
    - assets/images/banners/
    - assets/icons/
    - assets/fonts/

